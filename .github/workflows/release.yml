name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: read

concurrency:
  group: core-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.2"
  NODE_VERSION: "22.18.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  binaries:
    name: CLI and adapters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go test ./...
      - name: Cross-compile once
        run: sh scripts/release-binaries.sh "$TAG" dist
      # Upload before attest so a Rekor outage cannot block npm / GitHub Release.
      - uses: actions/upload-artifact@v7
        with:
          name: core-binaries
          path: dist/*
          retention-days: 7
      - id: attest-binaries
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Warn if binary attestation failed
        if: steps.attest-binaries.outcome == 'failure'
        run: echo "::warning::Sigstore attestation for binaries failed (often Rekor timeout). Artifacts were still uploaded."

  runner:
    name: Runner image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/envtie-runner
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      # GHCR denies read_package when the first push includes provenance or SBOM
      # attestations. Publish the image, then attach them once the package is readable.
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.TAG }}
          cache-from: type=gha,scope=core-runner
          cache-to: type=gha,mode=max,scope=core-runner
          provenance: false
          sbom: false
      - name: Wait until GHCR allows reading the package
        run: |
          set -eu
          image="ghcr.io/${{ github.repository_owner }}/envtie-runner@${{ steps.image.outputs.digest }}"
          for attempt in $(seq 1 24); do
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              exit 0
            fi
            echo "GHCR cannot read the package yet (attempt ${attempt})"
            sleep 5
          done
          echo "::error::Grant coddicat/envtie-core Actions write access on the envtie-runner package, then rerun Release."
          exit 1
      - id: attest-image
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/envtie-runner
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/envtie-runner@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: runner.spdx.json
      - id: attest-sbom
        if: steps.sbom.outcome == 'success'
        continue-on-error: true
        uses: actions/attest-sbom@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/envtie-runner
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: runner.spdx.json
          push-to-registry: true
      - name: Warn if image attestation failed
        if: steps.attest-image.outcome == 'failure' || steps.sbom.outcome == 'failure' || steps.attest-sbom.outcome == 'failure'
        run: echo "::warning::Sigstore/SBOM attestation for the runner image failed (often Rekor timeout). The image was still pushed."

  npm:
    name: npm packages
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Use trusted-publishing npm client
        run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: core-binaries
          path: dist
      - run: node scripts/package-npm.mjs "$TAG" dist dist/npm
      - name: Publish
        run: |
          set -eu
          channel=latest; case "$TAG" in *-*) channel=next ;; esac
          # Skip versions already on npm so a partial Release (e.g. Sigstore tlog
          # flake mid-loop) can be re-run without "version already exists".
          publish_one() {
            pkg=$1
            name=$(node -p "require('./${pkg}/package.json').name")
            ver=$(node -p "require('./${pkg}/package.json').version")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "skip ${name}@${ver} (already on npm)"
              return 0
            fi
            if npm publish "$pkg" --access public --tag "$channel" --provenance; then
              return 0
            fi
            # Sigstore Rekor flakes (409 / timeout) should not leave a release half-published.
            echo "::warning::provenance publish failed for ${name}@${ver}; retrying without provenance"
            npm publish "$pkg" --access public --tag "$channel"
          }
          for package in dist/npm/cli-*; do publish_one "$package"; done
          publish_one dist/npm/cli

  github:
    name: GitHub Release
    needs: [binaries, runner, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-binaries
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: dist/*
