name: Security

on:
  pull_request:
    paths: [go.mod, go.sum, "packages/cli/package.json"]
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies · vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: npm install --package-lock-only --ignore-scripts && npm audit --audit-level=high --omit=dev
        working-directory: packages/cli
