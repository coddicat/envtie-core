name: Tag release

# Creates one new envtie-core tag from current main and starts Release.
# The default token cannot start the tag-push workflow, so this dispatches it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: New tag, for example v1.4.0-rc.3. This becomes coddicat/envtie-core@<tag>.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: core-tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Tag the green main commit
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Use a semantic version tag such as v1.4.0 or v1.4.0-rc.3"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
            echo "::error::${VERSION} already exists. Choose a new tag."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          require() {
            workflow=$1
            label=$2
            conclusion=$(gh run list --workflow "$workflow" --branch main --commit "$sha" --limit 20 \
              --json status,conclusion --jq '[.[] | select(.status=="completed")][0].conclusion // empty')
            if [ "$conclusion" != success ]; then
              echo "::error::${label} is not green for ${sha}. Run that workflow on main (Actions → ${label} → Run workflow), then retry."
              exit 1
            fi
          }
          # CI and Docker smoke no longer run on push to main; dispatch them on
          # this commit before tagging.
          require ci.yml "CI"
          require docker-smoke.yml "Docker smoke"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "EnvTie Core ${VERSION}"
          git push origin "refs/tags/${VERSION}"
          gh workflow run release.yml --ref main -f "tag=${VERSION}"
          {
            echo "Tagged \`${sha}\` as \`${VERSION}\` and started Release."
            echo "Set \`ENVTIE_RUNNER_VERSION=${VERSION}\` on EnvTie.dev so generated runner workflows use this tag."
          } >> "$GITHUB_STEP_SUMMARY"
