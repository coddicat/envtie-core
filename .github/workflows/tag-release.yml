name: Tag release

# Creates one new envtie-core tag from current main and starts Release.
# The default token cannot start the tag-push workflow, so this dispatches it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: New tag, for example v1.4.0-rc.3. This becomes coddicat/envtie-core@<tag>.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: core-tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Tag the green main commit
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Use a semantic version tag such as v1.4.0 or v1.4.0-rc.3"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
            echo "::error::${VERSION} already exists. Choose a new tag."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          # Squash/rebase merges create a new main SHA that never ran CI. Prefer a
          # successful run on this SHA (manual dispatch), else the merged PR head.
          workflow_ok() {
            workflow=$1
            commit=$2
            conclusion=$(gh run list --workflow "$workflow" --commit "$commit" --limit 30 \
              --json status,conclusion,event --jq \
              '[.[] | select(.status=="completed" and (.event=="pull_request" or .event=="workflow_dispatch" or .event=="push"))][0].conclusion // empty')
            [ "$conclusion" = success ]
          }
          require() {
            workflow=$1
            label=$2
            if workflow_ok "$workflow" "$sha"; then
              echo "${label}: green on ${sha}"
              return 0
            fi
            head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')
            if [ -n "$head" ] && workflow_ok "$workflow" "$head"; then
              echo "${label}: green on merged PR head ${head} (main ${sha})"
              return 0
            fi
            echo "::error::${label} is not green for main ${sha} (or its merged PR). Merge a green PR, or run Actions → ${label} → Run workflow on main, then retry."
            exit 1
          }
          require ci.yml "CI"
          require docker-smoke.yml "Docker smoke"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "EnvTie Core ${VERSION}"
          git push origin "refs/tags/${VERSION}"
          gh workflow run release.yml --ref main -f "tag=${VERSION}"
          {
            echo "Tagged \`${sha}\` as \`${VERSION}\` and started Release."
            echo "Set \`ENVTIE_RUNNER_VERSION=${VERSION}\` on EnvTie.dev so generated runner workflows use this tag."
          } >> "$GITHUB_STEP_SUMMARY"
