name: Docker smoke

on:
  pull_request:
    paths:
      - "Dockerfile.runner"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "adapters/**"
      - "sdk/**"
  push:
    branches: [main]
    paths:
      - "Dockerfile.runner"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "adapters/**"
      - "sdk/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runner:
    name: Runner · image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=core-runner
          cache-to: type=gha,mode=max,scope=core-runner
