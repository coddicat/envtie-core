name: mailtrap-preview
components:
  - id: mail
    adapter: mailtrap@1
    ownership: managed
    config:
      account_id: "REPLACE_WITH_MAILTRAP_ACCOUNT_ID"
      project_id: "REPLACE_WITH_MAILTRAP_PROJECT_ID"
      # mode: dedicated (default) — one sandbox per environment; deleted on destroy.
      # mode: shared — one sandbox for the project (shared_sandbox_name or envtie-shared).
      #   Requires recipient_domain. Destroy does not delete the sandbox. Isolate tests
      #   by filtering Mailtrap messages for MAILTRAP_RECIPIENT_TAG. SMTP credentials are
      #   shared across environments; prefer dedicated when hard isolation matters.
      # mode: shared
      # recipient_domain: mail.example.test
      # shared_sandbox_name: envtie-shared
bindings:
  - from: mail.MAILTRAP_SMTP_HOST
    to: dotenv.MAILTRAP_SMTP_HOST
  - from: mail.MAILTRAP_SMTP_PORT
    to: dotenv.MAILTRAP_SMTP_PORT
  - from: mail.MAILTRAP_SMTP_USER
    to: dotenv.MAILTRAP_SMTP_USER
  - from: mail.MAILTRAP_SMTP_PASS
    to: dotenv.MAILTRAP_SMTP_PASS
  - from: mail.MAILTRAP_INBOX_ID
    to: dotenv.MAILTRAP_INBOX_ID
  # Bind when using mode: shared:
  # - from: mail.MAILTRAP_RECIPIENT_TAG
  #   to: dotenv.MAILTRAP_RECIPIENT_TAG
policy:
  expires_in: 1d
  protect: false
