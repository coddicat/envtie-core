# Canonical Neon + Upstash blueprint for a Windows runner. EnvTie.dev resolves
# official adapter binaries and verifies their signed-plan SHA-256 metadata.
# Dotenv bindings are written under the runner working directory.
name: consumer-bench
components:
  - id: postgres
    adapter: neon@1
    ownership: managed
    config:
      project_id: REPLACE_WITH_NEON_PROJECT_ID
      database_name: REPLACE_WITH_NEON_DATABASE
      role_name: REPLACE_WITH_NEON_ROLE
  - id: cache
    adapter: upstash@1
    ownership: managed
    depends_on: [postgres]
    config:
      email: REPLACE_WITH_UPSTASH_EMAIL
      platform: aws
      primary_region: us-east-1
bindings:
  - from: postgres.DATABASE_URL
    to: dotenv.DATABASE_URL
  - from: cache.UPSTASH_REDIS_REST_URL
    to: dotenv.UPSTASH_REDIS_REST_URL
  - from: cache.UPSTASH_REDIS_REST_TOKEN
    to: dotenv.UPSTASH_REDIS_REST_TOKEN
policy:
  expires_in: 1d
  protect: false
