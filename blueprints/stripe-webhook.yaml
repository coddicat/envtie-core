# Stripe without a host adapter: point host at your own public preview DNS.
# With vercel@1, use host: "{host.VERCEL_URL}", depends_on: [host], and bind
# secrets to vercel.env.* instead (see Blueprint wizard when both are selected).
name: stripe-preview
components:
  - id: stripe_webhook
    adapter: stripe@1
    ownership: managed
    config:
      host: "{env}.preview.example.com"
      path: /api/webhooks/stripe
      events: payment_intent.created,payment_intent.succeeded,checkout.session.completed,customer.subscription.updated,invoice.paid
bindings:
  - from: stripe_webhook.STRIPE_WEBHOOK_SECRET
    to: dotenv.STRIPE_WEBHOOK_SECRET
  - from: stripe_webhook.STRIPE_WEBHOOK_ENDPOINT_ID
    to: dotenv.STRIPE_WEBHOOK_ENDPOINT_ID
policy:
  expires_in: 7d
  protect: false
